services:
  meshly:
    build:
      context: .
      dockerfile: Dockerfile
    image: meshly-server:latest
    container_name: meshly-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "8080:8080"       # Meshly API + WebSockets
      - "51820:51820/udp" # WireGuard Tunnel
    volumes:
      - meshly_data:/etc/meshly
      - /lib/modules:/lib/modules:ro # Access host WireGuard kernel module if available
    environment:
      - MESHLY_API_PORT=8080
      - MESHLY_WG_PORT=51820
      - MESHLY_WG_INTERFACE=wg0
      - MESHLY_DATA_DIR=/etc/meshly
      # Set your server IP or domain here, or leave empty for auto-detection:
      # - MESHLY_PUBLIC_ENDPOINT=seu-ip-ou-dominio.com

volumes:
  meshly_data:
