<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meshly Server • Painel de Controle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --card: #111726;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --emerald: #10b981;
      --emerald-bg: rgba(16, 185, 129, 0.12);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      width: 38px;
      height: 38px;
      background: var(--emerald-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .brand p { font-size: 12px; color: var(--text-muted); }
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }
    .dot.offline { background: #64748b; box-shadow: none; }
    .room-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #151d30;
      border-bottom: 1px solid var(--card-border);
    }
    .room-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .room-title h3 { font-size: 15px; font-weight: 600; }
    .subnet-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--text-muted);
    }
    .room-actions {
      display: flex;
      gap: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 18px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.2);
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .btn {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-danger {
      background: var(--red-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .btn-danger:hover {
      background: var(--red);
      color: #fff;
    }
    .btn-primary {
      background: var(--blue);
      color: #fff;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo-badge">🌐</div>
        <div>
          <h1>MESHLY CONTROL PLANE</h1>
          <p>Painel de Gestão de Redes e Usuários</p>
        </div>
      </div>
      <div>
        <button class="btn btn-outline" onclick="loadRooms()">🔄 Atualizar</button>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat-pill">
        <span class="dot"></span>
        <span>WireGuard <strong>51820/UDP Ativo</strong></span>
      </div>
      <div class="stat-pill">
        <span>Redes Criadas: <strong id="stat-rooms">0</strong></span>
      </div>
      <div class="stat-pill">
        <span>Usuários Totais: <strong id="stat-peers">0</strong></span>
      </div>
    </div>

    <div id="rooms-container">
      <div class="empty-state">Carregando salas...</div>
    </div>
  </div>

  <script>
    async function loadRooms() {
      try {
        const res = await fetch('/api/v1/admin/rooms');
        const rooms = await res.json();
        renderRooms(rooms);
      } catch (err) {
        document.getElementById('rooms-container').innerHTML = '<div class="empty-state">Erro ao carregar salas: ' + err.message + '</div>';
      }
    }

    function renderRooms(rooms) {
      const container = document.getElementById('rooms-container');
      document.getElementById('stat-rooms').textContent = rooms.length;

      let totalPeers = 0;
      rooms.forEach(r => totalPeers += (r.peers ? r.peers.length : 0));
      document.getElementById('stat-peers').textContent = totalPeers;

      if (!rooms || rooms.length === 0) {
        container.innerHTML = '<div class="empty-state">Nenhuma rede criada ainda. Crie uma pelo aplicativo ou conecte um cliente.</div>';
        return;
      }

      container.innerHTML = rooms.map(r => {
        const peers = r.peers || [];
        const peersRows = peers.length === 0 
          ? '<tr><td colspan="5" style="text-align:center; color:#64748b; padding:20px;">Nenhum usuário nesta rede</td></tr>'
          : peers.map(p => `
            <tr>
              <td>
                <span class="dot ${p.is_online ? '' : 'offline'}" style="display:inline-block; margin-right:6px;"></span>
                <strong>${escape(p.nickname)}</strong>
              </td>
              <td class="mono" style="color:#60a5fa;">${p.virtual_ip}</td>
              <td class="mono" style="color:#64748b; font-size:11px;" title="${p.public_key}">${p.public_key.substring(0, 16)}...</td>
              <td style="color:#64748b; font-size:12px;">${p.joined_at}</td>
              <td>
                <button class="btn btn-danger" onclick="kickPeer('${r.id}', '${encodeURIComponent(p.public_key)}')">Expulsar</button>
              </td>
            </tr>
          `).join('');

        return `
          <div class="room-card" id="card-${r.id}">
            <div class="room-header">
              <div class="room-title">
                <h3>${escape(r.name)}</h3>
                <span class="subnet-badge">${r.subnet_cidr}</span>
                <span style="font-size:11px; color:#64748b;">Criada em ${r.created_at}</span>
              </div>
              <div class="room-actions">
                <button class="btn btn-outline" onclick="editRoom('${r.id}', '${escape(r.name)}')">Editar Senha</button>
                <button class="btn btn-danger" onclick="deleteRoom('${r.id}')">Excluir Rede</button>
              </div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Usuário</th>
                  <th>IP Virtual</th>
                  <th>Chave WireGuard</th>
                  <th>Conectado Em</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                ${peersRows}
              </tbody>
            </table>
          </div>
        `;
      }).join('');
    }

    async function kickPeer(roomId, pubKey) {
      if (!confirm('Deseja realmente expulsar este usuário da rede? O túnel dele será desconectado imediatamente.')) return;
      try {
        await fetch('/api/v1/admin/rooms/' + roomId + '/peers/' + pubKey, { method: 'DELETE' });
        loadRooms();
      } catch (e) {
        alert('Erro ao expulsar usuário: ' + e.message);
      }
    }

    async function deleteRoom(roomId) {
      if (!confirm('Tem certeza que deseja excluir esta rede? Todos os usuários nela serão desconectados.')) return;
      try {
        await fetch('/api/v1/admin/rooms/' + roomId, { method: 'DELETE' });
        loadRooms();
      } catch (e) {
        alert('Erro ao excluir rede: ' + e.message);
      }
    }

    async function editRoom(roomId, currentName) {
      const newPass = prompt('Digite a nova senha para a rede "' + currentName + '":');
      if (!newPass || newPass.length < 3) {
        if (newPass !== null) alert('A senha deve ter no mínimo 3 caracteres.');
        return;
      }
      try {
        await fetch('/api/v1/admin/rooms/' + roomId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: newPass })
        });
        alert('Senha alterada com sucesso!');
        loadRooms();
      } catch (e) {
        alert('Erro ao alterar senha: ' + e.message);
      }
    }

    function escape(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Auto-refresh a cada 5 segundos
    loadRooms();
    setInterval(loadRooms, 5000);
  </script>
</body>
</html>
