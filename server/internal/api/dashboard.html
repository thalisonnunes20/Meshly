<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meshly Control Plane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: #121215;
      --border: #222226;
      --text: #fafafa;
      --text-muted: #8b8b93;
      --text-dim: #52525b;
      --emerald: #10b981;
      --emerald-subtle: rgba(16, 185, 129, 0.1);
      --red: #f43f5e;
      --red-subtle: rgba(244, 63, 94, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 20px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 860px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text);
    }
    .brand-subtitle {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
    }
    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .stat-pill strong { color: var(--text); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); }
    .dot.offline { background: var(--text-dim); }
    .room-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #16161a;
      border-bottom: 1px solid var(--border);
    }
    .room-title-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .room-title-meta h3 { font-size: 13px; font-weight: 600; }
    .subnet-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 1px 6px;
      border-radius: 3px;
      color: var(--text-muted);
    }
    .room-actions {
      display: flex;
      gap: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 9px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.025);
    }
    th {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      background: #0e0e11;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .btn {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.12s ease;
    }
    .btn-danger {
      background: transparent;
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }
    .btn-danger:hover {
      background: var(--red);
      color: #fff;
    }
    .btn-subtle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-subtle:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }
    .empty-state {
      padding: 36px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="brand-title">MESHLY CONTROL PLANE</div>
        <div class="brand-subtitle">Server Dashboard</div>
      </div>
      <div>
        <button class="btn btn-subtle" onclick="loadRooms()">Atualizar</button>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat-pill">
        <span class="dot"></span>
        <span>WireGuard :51820/UDP</span>
      </div>
      <div class="stat-pill">
        <span>Redes: <strong id="stat-rooms">0</strong></span>
      </div>
      <div class="stat-pill">
        <span>Usuários: <strong id="stat-peers">0</strong></span>
      </div>
    </div>

    <div id="rooms-container">
      <div class="empty-state">Carregando redes...</div>
    </div>
  </div>

  <script>
    async function loadRooms() {
      try {
        const res = await fetch('/api/v1/admin/rooms');
        const rooms = await res.json();
        renderRooms(rooms);
      } catch (err) {
        document.getElementById('rooms-container').innerHTML = '<div class="empty-state">Erro ao carregar redes: ' + err.message + '</div>';
      }
    }

    function renderRooms(rooms) {
      const container = document.getElementById('rooms-container');
      document.getElementById('stat-rooms').textContent = rooms.length;

      let totalPeers = 0;
      rooms.forEach(r => totalPeers += (r.peers ? r.peers.length : 0));
      document.getElementById('stat-peers').textContent = totalPeers;

      if (!rooms || rooms.length === 0) {
        container.innerHTML = '<div class="empty-state">Nenhuma rede ativa no momento.</div>';
        return;
      }

      container.innerHTML = rooms.map(r => {
        const peers = r.peers || [];
        const peersRows = peers.length === 0 
          ? '<tr><td colspan="5" style="text-align:center; color:#52525b; padding:16px;">Nenhum usuário conectado</td></tr>'
          : peers.map(p => `
            <tr>
              <td>
                <span class="dot ${p.is_online ? '' : 'offline'}" style="display:inline-block; margin-right:6px;"></span>
                <strong style="color:#fafafa;">${escape(p.nickname)}</strong>
              </td>
              <td class="mono" style="color:#a1a1aa;">${p.virtual_ip}</td>
              <td class="mono" style="color:#52525b; font-size:11px;" title="${p.public_key}">${p.public_key.substring(0, 16)}...</td>
              <td style="color:#52525b; font-size:11px;">${p.joined_at}</td>
              <td>
                <button class="btn btn-danger" onclick="kickPeer('${r.id}', '${encodeURIComponent(p.public_key)}')">Expulsar</button>
              </td>
            </tr>
          `).join('');

        return `
          <div class="room-card" id="card-${r.id}">
            <div class="room-header">
              <div class="room-title-meta">
                <h3>${escape(r.name)}</h3>
                <span class="subnet-badge">${r.subnet_cidr}</span>
                <span style="font-size:11px; color:#52525b;">${r.created_at}</span>
              </div>
              <div class="room-actions">
                <button class="btn btn-subtle" onclick="editRoom('${r.id}', '${escape(r.name)}')">Mudar Senha</button>
                <button class="btn btn-danger" onclick="deleteRoom('${r.id}')">Excluir</button>
              </div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Usuário</th>
                  <th>IP Virtual</th>
                  <th>Chave WireGuard</th>
                  <th>Conectado Em</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody>
                ${peersRows}
              </tbody>
            </table>
          </div>
        `;
      }).join('');
    }

    async function kickPeer(roomId, pubKey) {
      if (!confirm('Deseja expulsar este usuário da rede? O túnel será desconectado.')) return;
      try {
        await fetch('/api/v1/admin/rooms/' + roomId + '/peers/' + pubKey, { method: 'DELETE' });
        loadRooms();
      } catch (e) {
        alert('Erro ao expulsar usuário: ' + e.message);
      }
    }

    async function deleteRoom(roomId) {
      if (!confirm('Excluir esta rede e desconectar todos os membros?')) return;
      try {
        await fetch('/api/v1/admin/rooms/' + roomId, { method: 'DELETE' });
        loadRooms();
      } catch (e) {
        alert('Erro ao excluir rede: ' + e.message);
      }
    }

    async function editRoom(roomId, currentName) {
      const newPass = prompt('Nova senha para a rede "' + currentName + '":');
      if (!newPass || newPass.length < 3) {
        if (newPass !== null) alert('A senha deve ter no mínimo 3 caracteres.');
        return;
      }
      try {
        await fetch('/api/v1/admin/rooms/' + roomId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: newPass })
        });
        loadRooms();
      } catch (e) {
        alert('Erro ao alterar senha: ' + e.message);
      }
    }

    function escape(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    loadRooms();
    setInterval(loadRooms, 5000);
  </script>
</body>
</html>
